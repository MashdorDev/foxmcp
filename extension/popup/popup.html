<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MCP Bridge for Firefox</title>
  <link rel="stylesheet" href="../ui.css">
  <style>
    body { width: 320px; }
    header { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 8px; }
    h1 { font-size: 14px; }
    #version { font-size: 11px; }
    section { padding: 10px 14px; border-top: 1px solid var(--border); }
    .status { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .status + p { margin: 4px 0 0 16px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #browserName { font-weight: 600; }
    #tabs { list-style: none; margin: 6px 0 0; padding: 0; }
    #tabs li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
    #tabs button.link { all: unset; cursor: pointer; flex: 1; min-width: 0; }
    #tabs button.link:focus-visible { outline: 2px solid var(--focus); }
    #tabs .title { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #tabs .label { display: block; font-size: 12px; color: var(--accent); }
    #tabs button.release { padding: 2px 8px; font-size: 12px; }
    label.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    label.toggle + label.toggle { margin-top: 8px; }
    .paused-note { margin: 6px 0 0; color: var(--bad); font-size: 12px; }
    footer { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 14px 12px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <h1>MCP Bridge for Firefox</h1>
    <span id="version" class="muted"></span>
  </header>

  <section aria-live="polite">
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">Not connected</span></div>
    <p id="servers" class="muted"></p>
    <p id="realInput" class="muted"></p>
  </section>

  <section>
    <div class="row">
      <span>This browser: <span id="browserName"></span></span>
      <a href="#" id="rename">Rename</a>
    </div>
  </section>

  <section id="agentSection" hidden>
    <div id="agentCount"></div>
    <ul id="tabs"></ul>
  </section>

  <section>
    <label class="toggle"><input type="checkbox" id="followAgent"> Show me the tab the agent works in</label>
    <label class="toggle pause"><input type="checkbox" id="paused"> Pause the agent</label>
    <p id="pausedNote" class="paused-note" hidden>Paused: every request is refused until you turn this off.</p>
  </section>

  <footer>
    <button id="reconnect">Reconnect</button>
    <button id="settings" class="primary">Settings</button>
  </footer>

  <script src="../settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
